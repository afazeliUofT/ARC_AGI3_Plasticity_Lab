budgets:
  action_budget: 3190
  persistent_state_size_cap_bytes: 0
  simulation_budget: 5000000
  token_budget: 4000000
description: Reference architecture (induce an executable world model, certify it
  by full-history backtest, plan inside it, predict before every action) on one cached
  public game per invocation under the official 5x per-level action budget, scored
  by RHAE against the official baselines.
experiment_id: E300_ref
language_model:
  identifier: claude-fable-5-1
  prompt: 'You are writing an executable world model of an unknown grid game from
    a recorded

    history of actions and the observations that followed them. The history is complete

    and exact; your program must reproduce EVERY recorded transition exactly (every
    grid

    cell, the state string and levels_completed) when replayed from the start, or
    it will

    be rejected with a counterexample. Prefer the simplest rule that explains all
    of the

    data. Return a single Python program implementing the contract below, in one fenced

    ```python block, with no other code blocks.

    '
model_calls_allowed: 60
network_calls_allowed: 0
runner: ref_world_model
