# sandbox_predict_seconds_max and sandbox_address_space_bytes_max of the pre-registration;
# the run records them in results.json and the verifier checks them against the locked values.
#
# Run:  uv run python scripts/run_experiment.py --config configs/experiments/E310_ref_backtest_rejection.yaml

