# E310_ref_backtest_rejection: does the full-history exact backtester reject wrong models?
#
# Pre-registered in preregistration/G3.yaml, backtest_rejection_experiment. The histories are
# the action logs of the graded G1 run 20260904T074939Z_seed12345_8383cad8 (SHA256SUMS digest
# below, hash-locked as g1_history_run_sha256sums_sha256), replayed through the offline
# toolkit. 25 games x 10 trial seeds = 250 wrong-model trials (eight seeded mutation classes)
# plus 25 control trials of the unmutated true simulator per invocation. No model, no
# network. The determinism protocol runs it twice at seed 12345 and once at seed 12346
