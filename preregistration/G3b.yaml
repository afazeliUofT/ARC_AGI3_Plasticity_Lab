rhae_aggregation:
  per_level: 'src/arc_plasticity/evaluation/rhae.py delegating to arc_agi.scorecard.EnvironmentScoreCalculator:
    level score min(((h_l / a_l) ** 2) * 100, 115.0) for a completed level with h_l the official
    metadata.json baseline_actions[l] and a_l the attributed action count; 0 for an uncompleted
    level; level weight w_l = l. The 115.0 cap is the toolkit''s (G3.yaml rhae_level_cap 1.15 in
    fraction units).

    '
  per_game: 'The toolkit''s environment score: the w_l-weighted mean of the level scores, capped at
    max_weights / total_weights x 100 where max_weights is the weight sum of completed levels (so one
    completed level of six scores at most 1/21 x 100 = 4.76, as cd82 showed). The project does not
    reimplement RHAE (CLAUDE.md item 3).

    '
  total: 'rhae_total_public_25 = the plain mean over the 25 graded game-runs of rhae_environment_score
    in percent (G3.yaml primary_metric.definition, unchanged); pass if >= 55.0. Recomputed by the
    verifier from each run''s level_accounting.json within rhae_recompute_abs_tolerance 1e-9.

    '
referee_notes:
- 'manifest.json git_dirty is true on every supervisor-job run: the supervisor rewrites state/PROJECT_STATE.json
  while a job runs and the human''s stray fix_job_runner.sh:Zone.Identifier file has been present
  since 2026-09-05; each run''s git_state.txt lists exactly the dirty paths. Reproducibility is judged
  from replay identity of transitions.jsonl (G3.yaml replay_final_frame_identity), not from that flag.

  '
- 'hypotheses.jsonl may carry a decertified record whose reason is WallclockExceededError (the shutdown
  of the last search at the wall-clock limit) rather than a prediction mismatch, as the E303 wa30
  run (h007, plan_index 28). Such records are not refutations by counterexample and must not be
  counted as such; the honest count reads the reason field.

  '
- 'cache_read was 0 on all 51 model calls of the pre-flight and diagnostic sets: prompt caching does
  not take effect through the headless client, so every call pays cache-creation price on the full
  history prompt. The USD-equivalent figures are therefore upper-bound list equivalents; the subscription
  meters model wall-clock (state/BUDGET.json g3_preflight.spend_currency).

  '
- 'Single seed, one run per game, one model: no per-game number carries a variance estimate; the
  25-game mean is a point estimate of one pass, as the platform itself scores. Any claim of the form
  "REF scores X on game g" is a single draw of a nondeterministic system.

  '
- 'The level completions in the diagnostic set were achieved by conjectures that were wrong about
  the completing transition (both decertified at the completing step): REF completes levels by acting
  on a good-enough model, not by predicting the level change correctly. Expect the same pattern.

  '
- 'The binding limit of every graded run is recorded in results.json (stop_reason, model_budget_binding,
  model_budget_consumed, plans_searched, and per-search outcomes in plans.jsonl); the referee should
  tabulate stop reasons over the 25 runs before reading the mean.

  '
- 'The G3.yaml threshold wallclock_per_invocation_seconds 7200 is overridden to 9900 here; the E301-E303
  diagnostic runs already used 10500 under the human''s 08:20:01Z default. No graded run uses any
  value other than 9900.

  '
