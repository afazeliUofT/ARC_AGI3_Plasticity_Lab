what_changes_and_why:
  purpose: 'Each of the three E303_ref diagnostic runs ended on a different limit and each limit decided
    that run''s outcome (docs/FINDINGS_E303.md section 4 and 6): s5i5 on the per-game simulation budget
    with the model idle, cd82 on the per-run model cap while completing levels, wa30 on the runner
    wall-clock through node-capped searches. A graded set whose scores are set by unexamined caps
    measures the caps, not the substrate. Five values are fixed below, each with the evidence that
    fixed it. No prompt change, no source change, no planner algorithm change is made: the configuration
    is E303_ref with five numbers changed, so the graded set stays one variable-group away from the
    validated diagnostic set.

    '
  items:
  - id: 1
    name: per-run model wall-clock cap (spend_control.model_wallclock_per_run_seconds)
    old: 2400
    new: 3600
    evidence: 'cd82 under E303_ref (artifacts/E303_ref/20260905T174628Z_seed12345_460bd1b1, results.json
      stop_reason model_budget_exhausted, model_budget_binding spend_control.model_wallclock_per_run_seconds,
      model_wallclock_seconds_total 2400.09, actions_total 27 of 855, levels_completed 1 of 6): the
      cap bound at call 10 while the run was completing levels by planned actions; call 10 timed out
      on the 243.66 s remainder with no program. s5i5 used 1417.5 s and wa30 968.1 s without binding.
      Per-call wall-clock grows with history length (cd82 60-666 s per call).

      '
    reasoning: '3600 s is 1.5 x the human-set 2400 s: at cd82''s mean of 240 s per call it buys about
      five more revise calls, enough for level 2 to be attempted; at the all-run median call of 54 s
      it buys 66 calls, so on fast-call games the G3.yaml ceiling of 60 calls per game binds first
      (item 2). Not larger, because the worst case scales linearly and no weekly denominator exists:
      25 x 3600 s = 90000 s of model time is the hard bound for the set (25 x 2400 = 60000 under the
      old cap); the measured E303 mean of 1595 s per run projects 39900 s, and only cap-bound games
      pay the increase. Not kept at 2400, because the human named that cap the binding constraint on
      the science and asked for it to be revisited here. This is a resource decision made before
      any graded result exists; it moves no pass threshold. human_override_route applies.

      '
  - id: 2
    name: per-run call cap (spend_control.calls_per_run_max)
    old: 40
    new: 60
    evidence: 'Human answer 2026-09-05T08:20:01Z section 3: at the median call 2400 s buys about 44
      calls, so calls_per_run_max 40 could become the binding limit on s5i5-like games. Under item 1
      that crossover moves to every game whose calls average under 60 s.

      '
    reasoning: '60 equals preregistration/G3.yaml thresholds.model_calls_per_game_max, the pre-registered
      per-game ceiling the verifier enforces on model_calls.jsonl; the spend_control copy duplicated
      that ceiling at a lower value for throttle reasons the wall-clock cap (item 1) already covers.
      With 60 the per-run model wall-clock is the single operational cap and the referee reads one
      binding limit per run, not two. No ceiling is loosened: 60 calls and 4000000 tokens per game
      remain the hash-locked maxima.

      '
  - id: 3
    name: planner node cap (planner.max_nodes) as the per-search cost bound
    old: 20000
    new: 2500
    evidence: 'Per search, steps_simulated = nodes_expanded x |candidate actions| (plans.jsonl of all
      three E303 runs): on s5i5 121 click points make one search cost up to 20000 x 121 = 2.4M steps,
      and search 16 spent 1424049 steps (28 percent of the 5M game budget); seven searches spent 92
      percent and 437 later searches were refused (outcome simulation_budget_exhausted). On wa30 (five
      actions, no ACTION6) 27 searches hit the 20000-node cap at 100000 steps and about 340 s each,
      9533 s of the 10500 s run. Every one of the 11 plans found across the ten diagnostic runs used
      at most 995 nodes (cd82 plan 8: 995 nodes, 125249 steps; s5i5 plan 14: 777 nodes; wa30 plan 0:
      53 nodes); the searches that exhausted the reachable set without a plan used 3039-11769 nodes.

      '
    reasoning: '2500 is 2.5 x the largest node count of any plan found so far and bounds one search
      at 2500 x 126 = 315000 steps (6.3 percent of the 5M game budget, so at least 15 searches per
      game) on click games and 12500 steps (about 42 s at wa30''s 3.4 ms per step) on five-action
      games. The per-game simulation budget stays at the hash-locked 5000000 (G3.yaml thresholds.simulation_steps_per_game_max;
      not raised, not lowered). A game-independent per-search step cap would be the cleaner bound
      but needs a planner source change and a new config key; it is recorded as the alternative
      not taken (docs/FINDINGS_E303.md section 6 item 3), as are object-centred click candidates.
      The cost of 2500 is that a plan needing more than 2500 expansions is now unreachable; the
      referee can see, per search, nodes_expanded, steps_simulated and outcome node_limit in plans.jsonl.

      '
  - id: 4
    name: runner wall-clock limit (wallclock_limit_seconds) and the supervisor job margin
    old: 10500 (job limit 10800, margin 300)
    new: 9900 (job limit 10800, margin 900)
    evidence: 'Supervisor job g36d-wa30-1 ran 10947 s against wallclock_limit_s 10800 and was not killed:
      the runner stopped itself at 10501.5 s and then spent about 446 s writing 200261 plan_traces.jsonl
      records and SHA256SUMS (state/supervisor.jsonl lines 254-255; docs/FINDINGS_E303.md section 5).
      A job the supervisor kills writes no manifest, so the runner''s own limit must always fire first.

      '
    reasoning: '10800 s is the supervisor''s maximum job wall-clock (launch route, option A) and is
      kept. 9900 s leaves a 900 s margin, twice the largest post-stop write observed, under the 20000-node
      cap that produced it; item 3 also shrinks the trace volume. Measured run wall-clocks under E303
      were 6647 s (s5i5), 3058 s (cd82) and 10501 s (wa30, binding); with item 3 the wa30 case is
      expected to spend far less in the planner. The G3.yaml threshold wallclock_per_invocation_seconds
      (7200) is overridden by this value (thresholds_overriding_g3); wallclock_per_game_total_seconds_max
      14400 and resumptions_per_game_max 3 stay as upper bounds but no resumption is used in this
      set (resumption_rule below).

      '
  - id: 5
    name: stop-reason semantics of model_budget_exhausted and the level accounting under each stop reason
    old: as implemented in src/arc_plasticity/agents/ref_world_model.py (sha256 92a1086ff3c246bbff61e64ebcf79238018cda98da3c50de846a4a29c0950b76)
    new: unchanged; stated here so the referee can check results.json against it
    semantics: 'A game-run stops with stop_reason model_budget_exhausted when the model budget is consumed
      (calls_per_run_max, model_wallclock_per_run_seconds, model_calls_per_game_max, tokens_per_game_max,
      or a client refusal) AND no certified program exists at that moment. While a certified program
      exists the run continues model-free: it plans inside it and executes with predict-before-act
      until the program is decertified by a mismatch, then stops. The run does NOT fall back to
      exploration once the model budget is consumed. This is preregistration/G3.yaml per_game_stop_rule
      (c) as written and as the cd82 run behaved (27 actions of 855 used, level 2 never attempted).

      '
    reasoning: 'The alternative (exploration until the level budget is spent) would be a source change
      to the runner before a graded set and a departure from the hash-locked stop rule; its expected
      gain is a lottery on random level completion (one level in 75 random game-runs in G1, docs/EVIDENCE_ARC.md
      3.1) at the cost of the run''s wall-clock; it is not taken. Consequence stated plainly: a game
      whose model budget is exhausted after k completed levels scores exactly those k levels, every
      later level 0, and the RHAE environment score is the toolkit''s weighted mean over all levels.
      Level accounting under every stop reason is preregistration/G3.yaml level_accounting_rule
      unchanged: level l is completed at the first action index at which levels_completed reaches
      l; an uncompleted level takes the run''s remaining actions; a level never reached scores 0.

      '
resumption_rule: 'No graded E304_ref run is resumed. A run that stops on wallclock (stop_reason wallclock,
  completion_status completed, as the E303 wa30 run) is final and is scored with the levels it reached;
  the resumption machinery of G3.yaml resumption_rule has never been exercised and exercising it
  first on a graded run would be an untested code path. resumptions_per_game_max therefore reads
  0 for this set (resumptions_used_max below); a run whose completion_status is not completed (step_failed,
  a non-zero exit, a supervisor kill) is labelled failed in the run set manifest and the game is
  run again under a new run id, at most once per game (failed_reruns_per_game_max), with the failed
  directory preserved and listed.

  '
