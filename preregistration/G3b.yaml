thresholds_overriding_g3:
- wallclock_per_invocation_seconds (7200 -> 9900; item 4)
thresholds_inherited_unchanged_note: 'Every other key of preregistration/G3.yaml thresholds is in force
  unchanged for the graded set, including rhae_total_min 55.0, backtest_rejection_fraction_min 0.95,
  model_calls_per_game_max 60, tokens_per_game_max 4000000, simulation_steps_per_game_max 5000000,
  the sandbox limits, action_budget_multiplier 5, per_level_actions_over_budget_max 0, replay_final_frame_identity_min
  1.0, cache_manifest_sha256, graded_sets_max 2. The keys above that do not exist in G3.yaml (model_wallclock_per_run_seconds,
  calls_per_run_max, planner_*, job_*, resumptions_used_max, failed_reruns_per_game_max, set_model_seconds_*,
  diagnostic_runs_excluded, graded_config_*, earliest_start_local) are new operational caps fixed
  here; none of them is a pass criterion.

  '
threshold_reasoning:
  rhae_total_min: inherited from G3.yaml unchanged (PROPOSAL_v2.md section 9 row G3); restated so this
    file cannot be read as changing it.
  backtest_rejection_fraction_min: inherited unchanged; the E310 result is graded against G3.yaml.
  backtest_correct_model_acceptance_min: inherited unchanged.
  graded_config_sha256: the digest every graded run's results.json config_file_sha256 must equal; a run
    under any other digest is not a member of the set.
  graded_config_derived_from_sha256: the validated diagnostic configuration this one is five lines away from.
  graded_config_line_changes_from_e303: five, enumerated under graded_experiment.derived_from and checkable
    by diff; a sixth difference means the graded config is not the pre-registered one.
  prompt_hash: the F1 prompt validated on s5i5 (compliance 3/3) and used by all three E303 runs; unchanged
    so that the graded set and the diagnostic set differ by caps alone.
  experiment_id: a new id so that artifacts/E304_ref/ starts empty and the run set manifest can never
    include a diagnostic run.
  model_wallclock_per_run_seconds: item 1.
  calls_per_run_max: item 2.
  planner_max_depth: unchanged from E303 (F3; the s5i5 goal needed 13 clicks against the old cap of 8).
  planner_max_nodes: item 3.
  planner_click_grid_step: unchanged from E303 (F2; pitch 16 missed two of s5i5's four buttons, pitch
    6 hits all four).
  planner_click_points: 121 = the lattice pitch 6 yields on the 64x64 grid, as RefParams reports; restated
    because it is the branching factor item 3's bound multiplies.
  simulation_steps_per_game_max: G3.yaml's hash-locked value, restated because item 3 is reasoned against it.
  wallclock_per_invocation_seconds: item 4.
  job_wallclock_limit_seconds: the supervisor's maximum job wall-clock; the agent may not request more.
  job_margin_over_runner_limit_seconds_min: item 4; twice the largest post-stop write observed.
  resumptions_used_max: resumption_rule; zero because the path is untested.
  failed_reruns_per_game_max: one re-run of a run whose completion_status is not completed; a second
    failure of the same game is a defect handled under the ladder, not by a third run.
  graded_games_required: as G3.yaml; a subset would let the easiest games be chosen.
  graded_runs_per_game: as G3.yaml; grading the best of several runs is selection.
  graded_sets_max: as G3.yaml; set_index_rule says how E304 counts.
  seed: as G3.yaml; the seed governs only exploration_fallback and tie-breaking.
  diagnostic_runs_excluded: the eleven directories enumerated above; the count lets a script confirm
    the list has not shrunk.
  set_model_seconds_hard_bound: 25 x 3600, the arithmetic bound of item 1; nothing can exceed it.
  set_model_seconds_escalate_above: 60000, the old cap's arithmetic bound (25 x 2400) and 1.5 x the E303
    mean projection (39900); crossing it before the set is complete means the caps are binding on
    most games and the human decides under section 6 item 10 whether the remaining runs proceed.
  earliest_start_local: the human budget directive; a job queued earlier is a violation of it, not a
    scientific defect.
verification:
  verifier: scripts/verify_run.py
  verifier_sha256_at_authoring: f355ad9f3ac3dcc6e2adbe3ea4d0a5b4e9edb5df2ae3af5ed8f1d6b9e4a8d1e6c
  verifier_sha256_note: 'The 16-character prefix f355ad9f3ac3dcc6 was read by sha256sum in the authoring
    turn; the full digest is recorded in the ledger entry for this step and the referee''s verdict
    records the digest of the verify_run.py that grades G3 (AGENT_CONSTITUTION.md section 7, correction
    of 2026-09-04). The verifier is unchanged since G3.yaml''s G3.2-G3.6 notes (state/PROJECT_STATE.json
    g3_components).

    '
  how_the_graded_set_is_verified: 'python scripts/verify_run.py --gate G3 --artifacts-root artifacts/E304_ref/
    (the G3 evaluator, extended as G3.yaml verification.verifier_extension_rule permits). The evaluator
    reads its thresholds from preregistration/G3.yaml, then loads preregistration/G3b.yaml and (a) replaces
    exactly the keys listed under thresholds_overriding_g3 with this file''s values, (b) reads the new
    operational keys from this file, (c) requires every graded run''s config_file_sha256 to equal graded_config_sha256
    and prompt_hash to equal prompt_hash, (d) records both pre-registration digests in its report.
    The still-pending E300-set checks of G3.yaml (run_set_manifest, official_baselines_used, action_budget_enforced,
    replay_final_frame_identity, rhae_recomputed, model_call_accounting, verification_active, preflight_recorded)
    are evaluated over artifacts/E304_ref/ and experiments/E304_ref_run_set.json; preflight_recorded
    reads state/BUDGET.json g3_preflight (games_measured 3, the no-denominator escalation ledger entry
    2026-09-05T07:34:32Z) and the three E300_ref pre-flight run ids under artifacts/E300_ref/, which
    is where they remain. Authoring these evaluators is model-free work scheduled before 2026-09-11.

    '
  additional_checks_this_file_requires:
  - graded_config_identity (every graded run's results.json config_file_sha256 == graded_config_sha256; manifest prompt_hash == prompt_hash; configs/experiments/E304_ref.yaml sha256 == graded_config_sha256 at the graded commit)
  - graded_config_derivation (diff of E303_ref.yaml and E304_ref.yaml has exactly the five named line changes)
  - spend_caps_respected (per run model_wallclock_seconds_total <= model_wallclock_per_run_seconds + one call_wallclock overrun; model_calls <= calls_per_run_max; manifest wallclock_limit_seconds == wallclock_per_invocation_seconds; wallclock_seconds <= wallclock_per_invocation_seconds + wallclock_reserve)
  - planner_caps_recorded (results.json planner block reports max_depth 16, max_nodes 2500, click_grid_step 6, click_points 121 for every run)
  - no_resumption (manifest resumptions empty or zero for every graded run)
  - diagnostic_runs_untouched (the eleven excluded directories still exist with their SHA256SUMS verifying, and none of their run ids appears in experiments/E304_ref_run_set.json)
  - stop_reason_semantics (a run with stop_reason model_budget_exhausted has model_budget_consumed true and no certified hypothesis at its last transition; a run with stop_reason wallclock has wallclock_seconds within reserve of the limit; a run with level_budget_exhausted has the current level's actions_attributed == its budget; a run with win has final_state WIN)
  referee_inspects_in_addition_to_g3_yaml:
  - this file against the ledger entry that recorded its sha256, to confirm no graded run predates it
  - the five-line diff between E303_ref.yaml and E304_ref.yaml
  - the stop_reason table over the 25 runs and which cap bound each
  - the cd82, s5i5 and wa30 runs of the graded set side by side with their E303 counterparts (same prompt, caps changed)
kill_rule: 'Inherited from preregistration/G3.yaml kill_rule unchanged: a complete set below rhae_total_min
  within the ceilings, after at most one ladder-driven second set, is an engineering finding recorded
  with the artifacts, and the human is asked under section 6 items 7 and 10 whether to raise the ceilings
  or change the model under a further successor, or to proceed to G4 on a substrate below the competitive
  standard with that limitation recorded in every later verdict; the threshold is never lowered. Added
  here: (i) a set interrupted by the allowance pauses and resumes, it is never graded partial; (ii)
  set_model_seconds_escalate_above crossed before completion is an item 10 escalation with the numbers,
  not a stop; (iii) a systematic defect discovered mid-set (a runner crash class, a sandbox failure
  class) is recorded in the ledger and the set continues to completion unless the defect makes the
  remaining runs meaningless, in which case the set is labelled failed as a whole in the run set manifest,
  the defect is fixed under the ladder, and set 2 is the one further complete set graded_sets_max allows.

  '
human_override_route: 'Any value in this file the human wishes to change before the first graded run (in
  particular item 1, a resource decision on the human''s shared allowance) is changed by a ledger entry
  or an ESCALATION answer naming the key and the value; the agent then authors preregistration/G3c.yaml
  as a successor of this file with exactly that change and, if a config value is involved, E305_ref.yaml
  by the named line change, records both digests in the ledger, and grades under G3c. This file is not
  amended (write-once, C1). After the first graded E304_ref run exists, no value changes for set 1.

  '
known_conflicts_at_authoring:
- 'preregistration/G3.yaml thresholds.wallclock_per_invocation_seconds is 7200 while the diagnostic runs
  used 10500 (human default of 2026-09-05T08:20:01Z) and this file fixes 9900; the override is explicit
  (thresholds_overriding_g3) and the referee is asked to note it.

  '
- 'scripts/verify_run.py has no evaluator for gate G3b and its G3 evaluator does not yet read this file;
  load_preregistration("G3b") loads it (gate G3b, thresholds mapping present). The overlay described
  under verification.how_the_graded_set_is_verified is authored as model-free work before 2026-09-11;
  until then the G3 pending checks report not_yet_evaluable failures, as designed.

  '
- 'state/throttle.json reads max_model_seconds_per_5h 20000 with ceiling_before_burst 5000 at authoring
  (a human burst setting); item 1''s reasoning uses the 5000 s ceiling, the conservative value.

  '
- 'The E303 wa30 job overran its supervisor limit without a kill; whether the supervisor kills at all at
  wallclock_limit_s is unverified (the runner always stopped first). Item 4 makes the runner stop first
  by a wider margin rather than relying on the kill.

  '
- 'cd82, s5i5 and wa30 have been run repeatedly during development and the prompt was fixed after reading
  their artifacts (diagnostic_runs_excluded_from_grading.consequence); the 25-game mean is the graded
  quantity and the three games are 12 percent of it.

  '
