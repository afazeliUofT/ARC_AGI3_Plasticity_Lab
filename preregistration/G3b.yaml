  cached_versions: as preregistration/G3.yaml experiment.cached_versions_run (25 full ids; 15 client-side
    replay versions differ; the cache is pinned by experiments/environment_cache_manifest.json 023726479a3c201161a61ee0d310b20696988933adbf1826dc9d7bd524d960af)
  seed: 12345
  seed_role: exploration_fallback and tie-breaking only (G3.yaml model_calls.nondeterminism_protocol);
    a single seed, one run per game, no selection among runs (graded_runs_per_game 1)
  order: 'The alphabetical order of the games list above, which is the config''s own order, one job at
    a time (concurrency 1), the next job queued only after the previous job''s result.json has been
    read and its run recorded in the ledger. Fixed here so that neither the cheapest nor the most
    promising games can be chosen first after early scores are seen; the order is a bookkeeping choice
    and moves no number.

    '
  earliest_start: 'Friday 2026-09-11 17:00 local (the weekly allowance reset), per the human budget
    directive 2026-09-05T19:19:50Z. No E304_ref job is queued before then. Between now and then the
    only work is model-free (verifier evaluators for the pending E300-set checks, run-set tooling,
    the ledger).

    '
  pause_rule: 'If the supervisor reports a usage-limit signal (session or weekly, AGENT_CONSTITUTION.md
    section 8) or the throttle refuses a job, the set PAUSES: no job is queued until the window resets,
    no run is discarded, no partial set is graded. An interrupted set resumes with the next game in
    order under the same configuration; completed runs are never re-run.

    '
  cost_accounting: 'After every run the agent records in the ledger and in state/BUDGET.json g3_graded_set:
    the run id, stop_reason, model_wallclock_seconds_total, the supervisor''s charged model seconds,
    tokens by kind, the USD equivalent at the G3.yaml pre-flight prices (10 / 50 / 0.25 / 12.50 USD
    per million input / output / cache-read / cache-creation tokens), the cumulative totals and the
    linear projection to 25 runs. Escalation under section 6 item 10 if the cumulative model time
    exceeds set_model_seconds_escalate_above (below) before the set is complete; the set does not
    stop by itself because a complete set below 55.0 is the pre-registered finding and an incomplete
    set is nothing.

    '
