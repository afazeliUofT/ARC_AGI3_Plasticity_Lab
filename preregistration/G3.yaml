threshold_reasoning:
  public_games_total: As G2; the cache manifest pins the 25 games and G3 must run all of them.
  public_levels_total: As G2; the RHAE denominator per game is the metadata level count, checked against the sum 183.
  rhae_total_min: >
    55.0 percent is the predicate's number: the lower published figure for this class of system
    (Rodionov, arXiv 2605.05138, 58.12 percent, GPT-5.5 high) minus a 3-point implementation margin,
    per PROPOSAL_v2.md section 9 row G3. Not raised toward the 78.4 or 100.00 entries, which used other
    models and more compute; not lowered because below it the substrate would not be at the standard
    the evidence base says every downstream comparison requires (docs/EVIDENCE_ARC.md section 5.4).
  rhae_recompute_abs_tolerance: As the G2 synthetic tolerance, 1e-9 in percent units; the recomputation uses the same adapter on the same integers.
  rhae_level_cap: Carried from G2 (1.15, square inside the min); restated so the G3 verifier can assert the adapter is unchanged.
  action_budget_multiplier: >
    5, the documented termination rule (docs/EVIDENCE_ARC.md section 2), fixed by G2 for later gates;
    the verifier reads it from the G2 file and requires this value to equal it.
  per_level_actions_over_budget_max: >
    Zero: a level whose attributed count exceeds 5h would be a level the platform would have terminated;
    scoring it would inflate RHAE. The runner stops the game; the verifier checks the artifact.
  graded_games_required: All 25; a subset would let the easiest games be chosen.
  graded_runs_per_game: >
    One: with a nondeterministic model, grading the best of several runs is selection, not measurement.
    The platform also scores a single run.
  graded_sets_max: >
    Two full sets: one honest re-run after a ladder fix is a real second attempt; more would be
    fishing at a cost the pre-flight was designed to bound.
  unlisted_run_dirs_max: Zero hidden runs; every attempt is preserved and listed.
  completed_runs_labelled_failed_max: Zero; a completed run cannot be discarded by relabelling.
  model_identifier: >
    claude-fable-5-1 is the only model identifier the evidence base documents (docs/EVIDENCE_TOOLING.md
    section 1) and the model this harness runs on. It is also the most expensive documented, which is
    what the pre-flight measures. Because the credential escalation (escalation_plan) must precede every
    model call, the human's answer may name a different identifier available to the subscription; if it
    does, that identifier is recorded in the ledger decision, in every manifest and in
    state/PROJECT_STATE.json, and it, not this default, is the frozen value the verifier requires on
    every call. This is the one variable the file leaves to a human answer, stated here so it is not a
    post-hoc choice: it is a resource decision made before any G3 result exists and it moves no threshold.
  model_effort: high, the constitution's implementation effort; the REF's calls are program-writing calls. Fixed so the pre-flight measures the graded setting.
  model_calls_per_game_max: >
    60 calls per game: enough for an initial induction and dozens of counterexample-driven revisions
    across up to ten levels, and small enough that 25 games are at most 1,500 calls. The published
    systems do not report call counts; this is the project's own ceiling and the pre-flight will say
    whether it is affordable.
  tokens_per_game_max: >
    4,000,000 tokens per game summed over all usage kinds; with prompts carrying the transition history
    and the current program, calls of 30,000-60,000 tokens x 60 calls fit. At list prices this bounds a
    game at roughly 40-200 USD equivalent depending on the cache mix, and a set at a few thousand at the
    very worst, which is why the pre-flight exists.
  simulation_steps_per_game_max: >
    5,000,000 program steps per game for planning; a pure-Python model at 10,000 steps per second gives
    about eight minutes of search, well inside the wall-clock.
  wallclock_per_invocation_seconds: 7200, the BUDGET.json default; the constitution forbids running without a limit.
  resumptions_per_game_max: >
    Three, so a game interrupted by the invocation limit can finish across supervisor turns by exact
    replay without the wall-clock becoming unbounded.
  wallclock_per_game_total_seconds_max: 14400 across resumptions, twice the invocation limit.
  cross_game_persistent_state_bytes_max: Zero; nothing crosses games in G3 (reference_architecture.cross_game_state).
  model_call_cwd_must_be_outside_repo: Leak control; the model must not be able to read the game sources or the human replays.
  model_call_tools_must_be_disabled: Leak control; a model with tools could read files or the network regardless of cwd.
  backtest_mismatches_for_certification_max: >
    Zero: the evidence base's load-bearing component is exact replay verification; a tolerance would let
    a wrong program plan.
  backtest_must_cover_full_history: The constitution's own example failure is a verifier that checks only the last 20 transitions.
  executed_plans_must_cite_certified_hypothesis: This is what "replay verification demonstrably active" means inside the graded runs, not only in E310.
  sandbox_backtest_seconds_max: 120 s per backtest of a history of at most a few thousand transitions.
  sandbox_predict_seconds_max: 5 s per single prediction; a slower program cannot be planned with.
  sandbox_address_space_bytes_max: 2 GiB; a runaway program must not take the machine down.
  backtest_wrong_model_trials_min: >
    250 seeded trials (25 games x 10) so that a 95 percent floor is tested with a resolution of 0.4
    percent per trial and every game contributes.
  backtest_control_trials_min: One control per game; a backtester that rejects everything would otherwise pass.
  backtest_mutation_classes_min: Eight, the pre-registered list; each must be present so a single easy class cannot carry the rate.
  backtest_trials_per_class_min: 20 per class, the smallest count at which one failure is visible as 5 percent of the class.
  backtest_vacuous_trials_max: 12, under 5 percent of 250, so exclusion of non-discriminating trials cannot materially move the rate.
  backtest_rejection_fraction_min: 0.95, the predicate's number.
  backtest_correct_model_acceptance_min: 1.0; the true simulator reproduces its own history and any rejection is a backtester defect.
  backtest_history_min_length: Every G1 history has at least 30 actions; 2 is the floor at which "full history" is distinguishable from "last frame".
  backtest_module_sha256_must_match_between_e300_and_e310: The E310 result certifies exactly the code the graded runs used, or it certifies nothing.
  preflight_games_measured: Three, the predicate's number; the games are fixed in cost_preflight.games.
  preflight_escalate_above_fraction: 0.35, state/BUDGET.json g3_preflight.escalate_above_fraction at authoring.
  preflight_must_precede_fourth_game_run: The pre-flight is worthless if the full run has already started.
  replay_final_frame_identity_min: As G1; a graded run whose action log does not replay is not evidence.
  replay_divergent_games_max: As G1, zero.
  network_calls_allowed: Zero in the runner process; the model subprocess is the only external channel and is counted separately.
  network_attempts_max: Zero, asserted by the live guard as in G1.
  cache_manifest_sha256: Hash-locked from the G2 verdict section 12 item 1; a different cache is a different experiment.
  cache_manifest_drift_files_max: As G1, zero.
  cached_games_required: As G1, 25.
  arc_agi_locked_version: As G1, 0.9.9 from uv.lock.
  official_baselines_must_match_metadata: Every h used by a run must equal the cached metadata.json value; the derived table never substitutes.
  human_baselines_json_sha256: The digest any citation of the derived table must carry (G2 verdict section 12 item 1).
  g1_termination_vs_budget_sha256: The digest of the budget artifact the design reads rather than re-measures (item 2).
  g1_history_run_sha256sums_sha256: The G1 run whose action logs are E310's histories, by its SHA256SUMS digest.
  determinism_identity_min: As G0-G2, for E310 only.
  contrast_seed_must_differ: As G1, for E310; the contrast variable is the trial seed.
  excluded_key_max_depth: As G1 exclusion_nesting_rule.
  excluded_key_container_values_allowed: As G1, false.
  sha256sums_verified_fraction_min: As G0-G2, every hash verifies, including files under model_calls/ and world_models/.
  sha256sums_must_list_every_artifact_file: As G0-G2; the directories of extra artifacts are listed file by file.
  uv_sync_exit_code: As G0.
  pytest_exit_code: As G0.
  pytest_min_tests_collected: As G0.
  ruff_exit_code: As G0.
  mypy_exit_code: As G0.
  git_status_porcelain_lines_max: As G0.
  licence_required_text: As G0, MIT-0.

verification:
  verifier: scripts/verify_run.py
  verifier_reads_thresholds_from: preregistration/G3.yaml
  verifier_sha256_at_authoring: de5fc873619c11e06f19def16d6aa138910e84e6de90cba0fcb4dde0ad4b416b
  verifier_extension_rule: >
    G3 extends scripts/verify_run.py with evaluate_g3 (and the module it imports for the RHAE
    recomputation and replay). Extension is authoring, not goalpost movement, because every number
    above lives here; the referee's verdict records the sha256 of the verify_run.py that graded G3
    (constitution section 7, correction of 2026-09-04).
  artifacts_root: artifacts/E300_ref/
  secondary_artifacts_root: artifacts/E310_ref_backtest_rejection/
  checks_in_order:
    - cache_manifest_locked (experiments/environment_cache_manifest.json sha256 == cache_manifest_sha256; 25 games; zero drift against environment_files/; arc-agi 0.9.9 in uv.lock)
    - run_set_manifest (experiments/E300_ref_run_set.json lists every directory under artifacts/E300_ref/; the highest-numbered complete set has one completed run per stem for all 25 stems; no completed run labelled failed; sets <= graded_sets_max)
    - run_artifact_completeness (the G0 contract plus the seven extra artifacts, for every run of the graded set and every E310 run)
    - sha256sums_verify (every listed file verifies, every file present is listed, both roots)
    - offline_run (manifest network_calls_allowed 0 and network_attempts 0, results operation_mode OFFLINE and network_guard, both experiments)
    - official_baselines_used (every graded run's level_accounting.json h values equal the cached metadata.json baseline_actions; rhae.py still contains the delegation text and imports arc_agi)
    - action_budget_enforced (per level actions_attributed <= action_budget_multiplier x h; a stop_reason consistent with per_game_stop_rule; multiplier equals the G2 value)
    - replay_final_frame_identity (every graded run's transitions.jsonl replayed offline in the verifier's process reproduces final_frame_sha256; as G1)
    - rhae_recomputed (per run from level_accounting.json through the adapter, within tolerance of results.json; the mean over the 25 >= rhae_total_min)
    - model_call_accounting (every call in model_calls.jsonl has prompt and response files with matching digests, identifier == the frozen identifier, effort == model_effort, cwd outside the repository, tools disabled; calls <= model_calls_per_game_max and summed tokens <= tokens_per_game_max per run; zero calls in E310)
    - verification_active (every plans.jsonl record cites a hypothesis whose backtests.jsonl certification has mismatches 0 and history_length_checked == history_length; backtest_module_sha256 equal across all E300 runs and the E310 runs)
    - backtest_rejection (E310 results: trials, classes, per-class minima, vacuous <= max, rejection_fraction >= min, correct acceptance == 1.0, histories replayed to the G1 final frame digests)
    - preflight_recorded (state/BUDGET.json g3_preflight.games_measured == 3, projected_fraction_of_weekly_allowance non-null or a ledger human_escalation entry for the no-denominator case, the three named games' run ids present in the run set with role preflight_graded)
    - exclusion_nesting (E310, before the identity check)
    - determinism_identity (E310: two same-seed invocations identical on results.json and metrics.csv after the G0 exclusions; the contrast seed differs)
    - git_status_clean, licence_text, uv_sync, pytest, ruff, mypy (as G0)
  referee_inspects:
    - src/arc_plasticity/hypotheses/backtest.py, to confirm it replays the whole history with exact comparison and no window, sampling or tolerance
    - src/arc_plasticity/agents/model_client.py and a sample of at least five model_calls/<n>.prompt.txt files across three games, for any content from environment_files/ or data/human_replays/ and for the tool-disabling flags and cwd
    - the wrong-model generator in E310, to confirm the mutations are applied on the model side and the backtester never sees the mutation
    - three graded runs traced by hand from transitions.jsonl to level_accounting.json to rhae.json (the highest-scoring game, the lowest-scoring game that completed at least one level, and wa30)
    - state/BUDGET.json g3_preflight against the three runs' model_calls.jsonl sums and the prices in docs/EVIDENCE_TOOLING.md section 1
    - the ledger for the credential escalation, the pre-flight decision entry, and any objection recorded against this file
  cited_evidence_required: every number in the verdict cites an artifact path and its SHA-256
  task_plan:
    - G3.1 this file (done when committed and its digest recorded)
    - G3.2 world-model interface, sandbox and backtester with unit tests, including a regression test that a windowed backtester fails the single_cell_flip-at-index-1 case
    - G3.3 E310 runner and config; graded E310 runs (two at 12345, one at 12346); evaluate_g3 checks for E310
    - G3.4 level accounting, stop rule, planner and exploration fallback exercised on the true simulator with zero model calls; E300 runner with a recorded-response stub; run set manifest tooling
    - G3.5 model-call adapter, prompt template, leak controls, cost accounting; authentication probe; section 6 item 1 escalation if the probe fails
    - G3.6 the three pre-flight game-runs; g3_preflight written; item 10 escalation if required
    - G3.7 the remaining 22 game-runs, one or more per turn, with resumption as needed
    - G3.8 verifier on a clean tree, C5 self-review (arguments to check by default: budget accounting that under-counts actions, a leak of game sources or replays into prompts, a backtester that certifies on a partial history, a model that memorised the public games), then the referee

kill_rule: >
  G3 has no mechanism, so there is no mechanism kill. A failed check caused by project code is fixed
  under the escalation ladder and the affected experiment re-run within graded_sets_max. A REF that
  completes a full set below rhae_total_min within the ceilings, after one ladder-driven second set,
  is an engineering finding: it is recorded with the artifacts, and the human is asked under section 6
  item 7 (routes exhausted) and item 10 (the ceilings are the budget) whether to raise the ceilings or
  change the model under a successor pre-registration, or to proceed to G4 on a substrate below the
  competitive standard with that limitation recorded in every later verdict; the threshold is never
  lowered. A pre-flight projection above 0.35 or with no denominator is escalated under item 10 before
  the fourth game-run. A credential that cannot be obtained is item 1 and, if an API key is the only
  route, item 2; neither is climbed under the ladder. A backtester that fails E310 is a defect fixed
  under the ladder before any graded E300 run, because a REF whose verification is broken produces
  scores that mean nothing.

known_conflicts_at_authoring:
  - >
    Model calls from inside a turn are expected to fail authentication (model_calls.authentication_status_at_authoring);
    the credential escalation is planned, not improvised, and the components that need no model are
    built first so the wait costs nothing.
  - >
    The usage gauge never fires in headless mode and the CLI has no usage query (docs/EVIDENCE_TOOLING.md
    section 11 items 2 and 7), so the pre-flight denominator can only come from the human; the file
    says what happens without it (cost_preflight.no_denominator_rule).
  - >
    PROPOSAL_v2.md section 14 item 5 lists the reference architecture "at >= 60 percent RHAE" as a
    deliverable while section 9 row G3 sets the gate predicate at 55; the gate predicate governs
    (CLAUDE.md names section 9 for gate predicates), 55.0 is what this file locks, and the referee is
    asked to note the discrepancy in the verdict.
  - >
    The Bash tool inside a turn caps a foreground command at ten minutes, while a game-run may need
    hours; runs are started in the background or per game across turns, and resumption_rule exists for
    an invocation cut short. Whether a background process survives the end of a supervisor turn is
    unknown at authoring and will be recorded in the ledger at G3.4; if it does not, one game-run per
    turn with resumption is the fallback.
  - >
    Every in-turn run records git_dirty true because the supervisor's counter edits (now in gitignored
    state/counters.json) and the turn's own ledger line are uncommitted at run time; the referee judges
    reproducibility from replay identity, not from that flag (as G1 and G2).
  - >
    The experiments/ skeleton already holds an empty experiments/E300_ref/ directory; E300_ref is the
    id the constitution's own example uses for the reference architecture and is adopted here. It
    contains no artifact.
  - >
    The three open tooling observations of preregistration/G1.yaml open_tooling_observations remain
    open; the first genuine usage-limit event, if the pre-flight or the full run triggers one, is to be
    quoted verbatim into docs/EVIDENCE_TOOLING.md section 11 item 3 from state/tool_errors.jsonl.
