[project]
name = "arc-plasticity"
version = "0.1.0"
description = "Mechanism laboratory for brain-inspired plasticity control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arc-agi>=0.9.9",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_plasticity"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# scripts/supervisor.py is frozen by AGENT_CONSTITUTION.md section 6 item 13; the agent may
# not edit it. Its 11 remaining findings are style only (re.I aliases, datetime.UTC,
# subprocess check=, one blind except) and are the human's to fix. Lift this exclusion once
# they are. See LEDGER decision 2026-09-04T06:44:21Z.
extend-exclude = ["scripts/supervisor.py"]

[tool.mypy]
python_version = "3.12"
packages = ["arc_plasticity"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
